[[package]]
name = "cuda-toolkit"
version = "13.2.2"
description = "CUDA Toolkit meta-package"
optional = false
python-versions = "*"
groups = ["main"]
markers = "python_version >= \"3.11\" and python_version < \"3.14\" and platform_system == \"Linux\""
files = [
    {file = "cuda_toolkit-13.2.2-py2.py3-none-any.whl", hash = "sha256:d12edc1aad1356236a2ee10c0d794b1aff5d3e79bfeca54867c3bb8e5afd87b0"},
]

[package.dependencies]
nvidia-cublas = {version = "==13.4.1.3.*", optional = true, markers = "sys_platform == \"win32\" and platform_machine == \"AMD64\" and (extra == \"cublas\" or extra == \"cusolver\") or sys_platform == \"linux\" and (extra == \"cublas\" or extra == \"cusolver\") and (platform_machine == \"aarch64\" or platform_machine == \"x86_64\")"}
